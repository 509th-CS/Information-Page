{% extends 'base.html' %}{% block content %}<section class="editor card"><div class="eyebrow">ADMINISTRATOR WORKSPACE</div><h1>{{ 'Edit post' if post else 'Create a post' }}</h1><p>Posts are visible to every signed-in member. Text is displayed as plain text, not HTML.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="title">Title</label><input id="title" name="title" maxlength="160" value="{{ post.title if post else '' }}" required><label for="category">Category</label><select id="category" name="category">{% for item in categories %}<option {% if post and post.category == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select><label for="body">Information</label><textarea id="body" name="body" rows="14" maxlength="20000" required>{{ post.body if post else '' }}</textarea><label class="check"><input type="checkbox" name="pinned" {% if post and post.pinned %}checked{% endif %}> Pin this post to the top</label><div class="actions"><button>Save post</button><a href="{{ url_for('home') }}">Cancel</a></div></form>{% if post %}<details><summary>Delete this post</summary><p>This cannot be undone.</p><form action="{{ url_for('delete', post_id=post.id) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Permanently delete</button></form></details>{% endif %}</section>{% endblock %}
